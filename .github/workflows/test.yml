name: Test
# why: the fast gate — ADR citation check, typecheck, unit tests. Cheap enough to
# run on every PR. The expensive browser tier lives in e2e.yml, gated separately.
on:
  # push only on master: a PR branch already triggers `pull_request`, so listening
  # to all pushes would double-run the whole suite on every PR commit. master push
  # is the post-merge backstop.
  push:
    branches: [master]
  pull_request:

# cancel superseded runs per ref so stacked pushes (and parallel agent sessions on
# the same branch) don't pile up — but let master runs finish (post-merge signal).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:adr
      - run: pnpm turbo run typecheck
      - run: pnpm turbo run test

  changeset:
    # why: gate every change to a publishable package on a changelog entry, so the
    # per-package CHANGELOGs can never silently fall behind the code. PR-only — on a
    # master push the diff is post-merge, and a missing changeset can't be fixed
    # there. apps/www + typescript-config are in the changeset `ignore` list, so
    # doc-only and app-only PRs pass with no changeset (the whole point of the split).
    # Escape hatch for a deliberate no-release change: `pnpm changeset --empty`.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # `changeset status --since` diffs against the base branch, so it needs the
          # origin/<base> remote-tracking ref + history that the default depth-1
          # checkout doesn't fetch.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status --since=origin/${{ github.base_ref }}
