name: Test
# why: the fast gate — ADR citation check, typecheck, unit tests. Cheap enough to
# run on every PR. The expensive browser tier lives in e2e.yml, gated separately.
on:
  # push only on master: a PR branch already triggers `pull_request`, so listening
  # to all pushes would double-run the whole suite on every PR commit. master push
  # is the post-merge backstop.
  push:
    branches: [master]
  pull_request:

# cancel superseded runs per ref so stacked pushes (and parallel agent sessions on
# the same branch) don't pile up — but let master runs finish (post-merge signal).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:adr
      - run: pnpm turbo run typecheck
      - run: pnpm turbo run test
