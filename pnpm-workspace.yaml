# packages/ = publishable npm artifacts; apps/ = deployed targets. Internal packages
# never publish dist between themselves — consumers resolve to src, not built output
# (ADR-0011). The ADR number is an API: never renumber (ADR-0011 §5).
packages:
  - 'packages/*'
  - 'apps/*'

catalog:
  typescript: ^5.0.0
  vitest: ^3.0.0
  '@vitest/coverage-v8': ^3.0.0
  vite-tsconfig-paths: ^5.0.0
  '@vitejs/plugin-react': ^4.0.0

# pnpm 11 replaced onlyBuiltDependencies with allowBuilds (strictDepBuilds is
# now on by default, so unlisted build scripts hard-error during install).
allowBuilds:
  esbuild: true
  sharp: true
